[package]
name = "bg-script-management"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bg_script_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 命令级集成测试：这些测试使用 tauri::test mock runtime，会链接 comctl32 v6，
# 必须显式声明为 test target，build.rs 才能用 `rustc-link-arg-tests`
# 单独给测试二进制嵌入 Common-Controls v6 清单（lib 单测不链接 GUI，无需清单）。
[[test]]
name = "commands"
path = "tests/commands.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "sync", "io-util", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
encoding_rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

